<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BookFlow</title>
  <link rel="stylesheet" href="css/style.css?v=8" />
</head>
<body>
  <!-- Coque : cadre téléphone déjà en paysage, le lecteur dedans.
       On arrive DIRECTEMENT sur le lecteur — plus d'accueil ni de fiche.
       La version avec navigation est conservée dans ../proto-nav/ -->
  <div class="device">
    <div class="device__notch"></div>
    <section class="player">
      <iframe id="player-frame" title="Lecteur BookFlow" src="reader.html?embed=1&amp;v=8"></iframe>
    </section>
  </div>

  <script>
  /* Plein écran au PREMIER appui dans le lecteur.
     Raison : le navigateur intégré de LinkedIn (Chrome Custom Tabs) affiche une
     barre non masquable en CSS ; seule l'API Fullscreen la fait disparaître, et
     elle exige un geste utilisateur direct. Avant, ce geste était le tap sur la
     jaquette — supprimée. On l'accroche donc au premier pointerdown DANS l'iframe
     (même origine, donc accessible). Échec silencieux ailleurs (iPhone/Safari ne
     supporte pas l'API : le lecteur fonctionne quand même). */
  function enterFullscreen(){
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if (req){ try{ const r = req.call(el); if (r && r.catch) r.catch(()=>{}); }catch(e){} }
  }
  const frame = document.getElementById('player-frame');
  frame.addEventListener('load', () => {
    try{
      frame.contentDocument.addEventListener('pointerdown', enterFullscreen, {once:true});
    }catch(e){ /* file:// ou origine différente : on s'en passe */ }
  });
  </script>
</body>
</html>
